{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

<div class="card shadow-lg border-0">

<div class="card-header bg-primary text-white">

<h3>👤 My Profile</h3>

</div>

<div class="card-body">

<table class="table table-bordered">

<tr>
<th>Username</th>
<td>{{ user.username }}</td>
</tr>

<tr>
<th>Role</th>
<td>Administrator</td>
</tr>

<tr>
<th>Institute</th>
<td>IF Professional Studies (IFPS)</td>
</tr>

<tr>
<th>Account Status</th>
<td><span class="badge bg-success">Active</span></td>
</tr>

</table>

</div>

</div>

</div>

{% endblock %}
