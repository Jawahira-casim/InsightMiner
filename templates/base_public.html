<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>InsightMiner | IFPS Institute</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { min-height: 100vh; background: #343a40; color: white; }
        .logo-img { width: 120px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            
                <img src="{{ url_for('static', filename='logo.png') }}" class="logo-img" alt="IFPS Logo">
                <hr>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link text-white" href="/upload">Upload</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#">Analytics</a></li>
                </ul>
            </nav>
            
            <main class="col-md-10 p-4">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
</body>
</html>
