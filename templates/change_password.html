{% extends 'base.html' %}
{% block content %}

<div class="container mt-4">

<div class="card shadow-lg border-0">

<div class="card-header bg-primary text-white">
<h3>🔑 Change Password</h3>
</div>

<div class="card-body">
    {% if message %}
<div class="alert alert-{{ status }}">
    {{ message }}
</div>
{% endif %}

<form method="POST">

<div class="mb-3">
<label>Current Password</label>
<input type="password"
       name="old_password"
       class="form-control"
       required>
</div>

<div class="mb-3">
<label>New Password</label>
<input type="password"
       name="new_password"
       class="form-control"
       required>
</div>

<div class="mb-3">
<label>Confirm New Password</label>
<input type="password"
       name="confirm_password"
       class="form-control"
       required>
</div>

<button class="btn btn-success">
Update Password
</button>

</form>

</div>

</div>

</div>

{% endblock %}
